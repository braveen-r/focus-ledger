version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/focusledger.duckdb:/app/focusledger.duckdb
    environment:
      - ENVIRONMENT=production

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
