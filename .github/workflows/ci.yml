name: FocusLedger CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify Backend Docker Build
      run: docker build -t focusledger-backend ./backend

    - name: Verify Frontend Docker Build
      run: docker build -t focusledger-frontend ./frontend

    - name: Test Docker Compose Orchestration
      run: docker compose config
