name: FocusLedger CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv and Dependencies
      working-directory: ./backend
      run: |
        pip install uv
        uv pip install --system -r pyproject.toml pytest httpx

    - name: Run Pytest Suite
      working-directory: ./backend
      run: python -m pytest -v

  build-containers:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify Backend Docker Build
      run: docker build -t focusledger-backend ./backend

    - name: Verify Frontend Docker Build
      run: docker build -t focusledger-frontend ./frontend

    - name: Test Docker Compose Orchestration
      run: docker compose config
